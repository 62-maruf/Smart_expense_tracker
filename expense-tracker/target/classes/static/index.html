<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Smart Expense Tracker</h1>

  <section>
    <h2>Add Expense</h2>
    <form id="expense-form">
      <input id="title" placeholder="Title" required>
      <input id="amount" type="number" step="0.01" placeholder="Amount" required>
      <select id="currency"></select>
      <select id="category">
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Other</option>
      </select>
      <input id="date" type="date">
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <h2>Expenses</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <p>
      Total in
      <select id="total-currency"></select>:
      <strong id="total">-</strong>
    </p>
  </section>

  <section>
    <h2>Currency Converter</h2>
    <input id="conv-amount" type="number" step="0.01" value="1">
    <select id="conv-from"></select>
    to
    <select id="conv-to"></select>
    <button id="conv-btn">Convert</button>
    <p id="conv-result"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
